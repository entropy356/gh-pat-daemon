name: Build Release Artifacts

on:
  push:
    branches:
      - main
    # 纯文档改动不触发构建；tags 与 workflow_dispatch 不受 paths-ignore 影响
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "LICENSE"
      - ".gitignore"
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and publish ghpatd
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain with musl target
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache cargo build
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: ghpatd

      - name: Install system dependencies (musl-tools & age)
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools age file

      - name: Read project version from Cargo.toml
        id: version
        run: |
          VERSION="$(grep -m1 '^version' ghpatd/Cargo.toml | sed 's/^version *= *"\(.*\)"/\1/')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "ghpatd version: ${VERSION}"

      - name: Run unit tests
        working-directory: ghpatd
        run: cargo test --locked

      - name: Build static musl release binary
        working-directory: ghpatd
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Stage release binary & verify static-pie
        run: |
          cp ghpatd/target/x86_64-unknown-linux-musl/release/ghpatd ./release/ghpatd-linux-x86_64
          chmod +x ./release/ghpatd-linux-x86_64
          file ./release/ghpatd-linux-x86_64
          file ./release/ghpatd-linux-x86_64 | grep -E "static-pie linked|statically linked"
          file ./release/ghpatd-linux-x86_64 | grep "stripped"
          ldd ./release/ghpatd-linux-x86_64 2>&1 || true

      - name: Run integration test suite
        run: bash ./release/run_tests.sh ./release/ghpatd-linux-x86_64

      - name: Generate and verify SHA256SUMS
        working-directory: release
        run: |
          cp ../docs/usage/API.md ./api.md
          sha256sum ghpatd-linux-x86_64 api.md run_tests.sh > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS

      # 非发布运行（arena 分支 / 手动触发）产物走 Actions artifact，不回写 git、不碰 Release
      - name: Upload build artifacts
        if: github.ref_type == 'branch' && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ghpatd-linux-x86_64
          path: |
            release/ghpatd-linux-x86_64
            release/api.md
            release/run_tests.sh
            release/SHA256SUMS
          retention-days: 14
          if-no-files-found: error

      # 仅 tag 推送或 main 分支推送/手动触发时发布，杜绝 arena 分支覆盖线上 Release
      - name: Publish or update GitHub Release
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          # 发布说明 = RELEASE_NOTES.md + 统一口径的 SHA256SUMS（与上传资产完全一致）
          {
            cat release/RELEASE_NOTES.md
            echo ""
            echo "## SHA256SUMS"
            echo ""
            echo '```text'
            cat release/SHA256SUMS
            echo '```'
          } > /tmp/release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "ghpatd ${TAG}" --notes-file /tmp/release-notes.md
            gh release upload "$TAG" ./release/ghpatd-linux-x86_64 ./release/api.md ./release/run_tests.sh ./release/SHA256SUMS --clobber
          else
            gh release create "$TAG" ./release/ghpatd-linux-x86_64 ./release/api.md ./release/run_tests.sh ./release/SHA256SUMS \
              --target "$GITHUB_SHA" \
              --title "ghpatd ${TAG}" \
              --notes-file /tmp/release-notes.md
          fi
