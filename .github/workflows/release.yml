name: Build Release Artifacts

on:
  push:
    branches:
      - main
      - "arena/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if Rust rebuild is needed
        id: check_rebuild
        run: |
          if [ -x ./release/ghpatd-linux-x86_64 ] && (cd release && sha256sum -c SHA256SUMS >/dev/null 2>&1); then
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- ghpatd/ 2>/dev/null || echo "rebuild")
            if [ -z "$CHANGED" ]; then
              echo "needed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "needed=true" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies (musl-tools & age)
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools age file

      - name: Install Rust toolchain with musl target
        if: steps.check_rebuild.outputs.needed == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Run unit tests (A2)
        if: steps.check_rebuild.outputs.needed == 'true'
        working-directory: ghpatd
        run: cargo test

      - name: Build static musl release binary (A1)
        if: steps.check_rebuild.outputs.needed == 'true'
        working-directory: ghpatd
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Stage release binary & verify static-pie (A4)
        run: |
          if [ "${{ steps.check_rebuild.outputs.needed }}" = "true" ]; then
            cp ghpatd/target/x86_64-unknown-linux-musl/release/ghpatd ./release/ghpatd-linux-x86_64
          fi
          chmod +x ./release/ghpatd-linux-x86_64
          file ./release/ghpatd-linux-x86_64
          file ./release/ghpatd-linux-x86_64 | grep -E "static-pie linked|statically linked"
          file ./release/ghpatd-linux-x86_64 | grep "stripped"
          ldd ./release/ghpatd-linux-x86_64 2>&1 || true

      - name: Run integration test suite (A3)
        run: bash ./release/run_tests.sh ./release/ghpatd-linux-x86_64

      - name: Generate and verify SHA256SUMS
        working-directory: release
        run: |
          sha256sum ghpatd-linux-x86_64 run_tests.sh > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Commit release artifacts to branch
        if: github.ref_type == 'branch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/ghpatd-linux-x86_64 release/SHA256SUMS
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): build ghpatd-linux-x86_64 and update SHA256SUMS [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Publish or update GitHub Release v0.0.2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp docs/usage/API.md /tmp/api.md
          cat release/RELEASE_NOTES.md > /tmp/release-notes.md
          cat <<'EOF' >> /tmp/release-notes.md

          ## SHA256SUMS

          ```text
          EOF
          (cd /tmp && sha256sum "$GITHUB_WORKSPACE/release/ghpatd-linux-x86_64" api.md "$GITHUB_WORKSPACE/release/run_tests.sh" | sed "s|$GITHUB_WORKSPACE/release/||g") >> /tmp/release-notes.md
          echo '```' >> /tmp/release-notes.md
          if gh release view v0.0.2 >/dev/null 2>&1; then
            gh release edit v0.0.2 --title "ghpatd v0.0.2" --notes-file /tmp/release-notes.md
            gh release upload v0.0.2 ./release/ghpatd-linux-x86_64 /tmp/api.md ./release/run_tests.sh ./release/SHA256SUMS --clobber
          else
            gh release create v0.0.2 ./release/ghpatd-linux-x86_64 /tmp/api.md ./release/run_tests.sh ./release/SHA256SUMS \
              --target "$(git rev-parse HEAD)" \
              --title "ghpatd v0.0.2" \
              --notes-file /tmp/release-notes.md
          fi
