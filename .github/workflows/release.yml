name: Build Release Artifacts

on:
  push:
    branches:
      - main
      - "arena/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if Rust rebuild is needed
        id: check_rebuild
        run: |
          if [ -x ./ghpatd-linux-x86_64 ] && sha256sum -c SHA256SUMS >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- ghpatd/ 2>/dev/null || echo "rebuild")
            if [ -z "$CHANGED" ]; then
              echo "needed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "needed=true" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies (musl-tools & age)
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools age file

      - name: Install Rust toolchain with musl target
        if: steps.check_rebuild.outputs.needed == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Run unit tests (A2)
        if: steps.check_rebuild.outputs.needed == 'true'
        working-directory: ghpatd
        run: cargo test

      - name: Build static musl release binary (A1)
        if: steps.check_rebuild.outputs.needed == 'true'
        working-directory: ghpatd
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Stage release binary & verify static-pie (A4)
        run: |
          if [ "${{ steps.check_rebuild.outputs.needed }}" = "true" ]; then
            cp ghpatd/target/x86_64-unknown-linux-musl/release/ghpatd ./ghpatd-linux-x86_64
          fi
          chmod +x ./ghpatd-linux-x86_64
          file ./ghpatd-linux-x86_64
          file ./ghpatd-linux-x86_64 | grep -E "static-pie linked|statically linked"
          file ./ghpatd-linux-x86_64 | grep "stripped"
          ldd ./ghpatd-linux-x86_64 2>&1 || true

      - name: Run integration test suite (A3)
        run: bash run_tests.sh ./ghpatd-linux-x86_64

      - name: Generate and verify SHA256SUMS
        run: |
          sha256sum ghpatd-linux-x86_64 run_tests.sh README.md > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Commit release artifacts to branch
        if: github.ref_type == 'branch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ghpatd-linux-x86_64 SHA256SUMS
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): build ghpatd-linux-x86_64 and update SHA256SUMS [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Publish or update GitHub Release v0.0.2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat <<'NOTES' > /tmp/release-notes.md
          ## 给云端 AI Agent 的安装与使用 Prompt（一键复制发送给 Agent）

          ````markdown
          请在当前 Linux 环境中安装并使用 `ghpatd`（GitHub PAT 内存代理），按以下步骤操作：

          ### 1. 下载并安装 ghpatd 到 $PATH
          ```bash
          curl -fsSLO https://github.com/entropy356/gh-pat-daemon/releases/download/v0.0.2/ghpatd-linux-x86_64
          curl -fsSLO https://github.com/entropy356/gh-pat-daemon/releases/download/v0.0.2/SHA256SUMS
          grep ghpatd-linux-x86_64 SHA256SUMS | sha256sum -c -
          install -m 0755 ./ghpatd-linux-x86_64 /usr/local/bin/ghpatd || sudo install -m 0755 ./ghpatd-linux-x86_64 /usr/local/bin/ghpatd
          ```
          （若当前仓库目录已有 `./ghpatd-linux-x86_64`，直接执行 `install -m 0755 ./ghpatd-linux-x86_64 /usr/local/bin/ghpatd` 即可。）

          ### 2. 启动 daemon 并把公钥发给我
          ```bash
          ghpatd start
          # 如需配置 git 提交署名：
          # ghpatd start --user-name "<Name>" --user-email "<Email>"
          ```
          将输出的 `age1...` 公钥发给我，并等待我在本地用 `age -r <公钥> -a` 加密 PAT 后把 ASCII armored 密文发给你。

          ### 3. 收到我发来的密文后，通过 stdin 注入（严禁落盘）
          ```bash
          ghpatd set-token <<'EOF'
          -----BEGIN AGE ENCRYPTED FILE-----
          ...
          -----END AGE ENCRYPTED FILE-----
          EOF
          ghpatd status
          ```

          ### 4. 日常使用与销毁
          - 执行 git 远程操作：`ghpatd wrap -- git pull`、`ghpatd wrap -- git push`、`ghpatd wrap -- git clone https://github.com/owner/repo.git`
          - 执行 GitHub 操作：`ghpatd auth status`、`ghpatd repo view`、`ghpatd pr list`、`ghpatd pr create ...`、`ghpatd issue list`、`ghpatd api <endpoint>`
          - 任务全部完成后销毁内存凭据：`ghpatd stop`

          ### 5. 安全铁律（必须严格遵守）
          - **严禁尝试获取、读取、打印、记录或导出 PAT 明文**。
          - **严禁主动调用 `ghpatd cred-helper get` 或直接向 socket 发送 `get_pat` 请求来读取 token**。
          - **严禁向我索要 PAT 明文，也严禁将收到的密文或任何凭据写入磁盘文件、环境变量或日志**。
          - 只能通过 `ghpatd wrap -- git ...` 或 `ghpatd <repo|pr|issue|api|auth>` 间接使用凭据。
          ````

          ---

          ## 用户本地加密命令（在人类本地终端执行）

          收到云端 Agent 发来的 `age1...` 公钥后，在本地终端执行以下命令并将输出的整段 `-----BEGIN AGE ENCRYPTED FILE----- ... -----END AGE ENCRYPTED FILE-----` 文本复制发送给 Agent：

          ```bash
          printf '%s' "ghp_xxxxxxxxxxxxxxxxxxxx" | age -r age1xxxxxxxx... -a
          ```

          ---

          ## 产物校验和（`SHA256SUMS`）

          ```text
          NOTES
          cat SHA256SUMS >> /tmp/release-notes.md
          echo '```' >> /tmp/release-notes.md
          if gh release view v0.0.2 >/dev/null 2>&1; then
            gh release edit v0.0.2 --title "ghpatd v0.0.2" --notes-file /tmp/release-notes.md
            gh release upload v0.0.2 ./ghpatd-linux-x86_64 ./run_tests.sh ./SHA256SUMS --clobber
          else
            gh release create v0.0.2 ./ghpatd-linux-x86_64 ./run_tests.sh ./SHA256SUMS \
              --target "$(git rev-parse HEAD)" \
              --title "ghpatd v0.0.2" \
              --notes-file /tmp/release-notes.md
          fi
