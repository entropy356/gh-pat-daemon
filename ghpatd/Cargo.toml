[package]
name = "gh-pat-daemon"
version = "0.0.2"
edition = "2021"
rust-version = "1.75"
description = "面向 AI 智能体的 GitHub PAT 内存代理（daemon + client + cred-helper 单二进制 ghpatd）"

[[bin]]
name = "ghpatd"
path = "src/main.rs"

[dependencies]
age = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "signal", "process", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["zeroize_derive"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
libc = "0.2"
base64 = "0.22"
dirs = "5"
bech32 = "0.9"
jaq-core = "2"
jaq-std = "2"
jaq-json = { version = "1", features = ["serde_json"] }
jaq-syn = "1"

[profile.release]
lto = "thin"
strip = true
panic = "unwind"
codegen-units = 1
